# =============================================================================
# Best Practices
# =============================================================================
#
# 1. Start Small:
#    - Begin with a single directory (e.g., "src/**/*.py")
#    - Gradually expand include patterns as you verify they work
#
# 2. Be Specific:
#    - Use specific include patterns rather than "**/*"
#    - This improves performance and reduces false positives
#
# 3. Test Your Patterns:
#    - Use command-line glob tools to test patterns before adding them
#    - Example: find . -name "*.py" | grep -v "__pycache__"
#
# 4. Ownership Granularity:
#    - Don't make rules too granular (file-level is usually too specific)
#    - Component or module level is usually appropriate
#
# 5. Review Regularly:
#    - Update ownership rules when team structure changes
#    - Adjust thresholds based on team feedback and project evolution
#    - Remove disabled notification channels to keep config clean
#
# 6. Security:
#    - Never commit credentials directly (use environment variables)
#    - Use SSH keys or personal access tokens for authentication
#    - Rotate access tokens regularly
#
# 7. Environment-Specific Configs:
#    - Use environment variables for values that differ by environment
#    - Example: ${PROJECT_BRANCH:-main} allows override per environment
#
# =============================================================================
