# Project Configuration Template for PX BugHunter
# Copy this file and rename it to create a new project configuration.
# Example: cp example.yaml my-project.yaml

# Project metadata
name: "example-project"
display_name: "Example Project"
description: "Example project configuration template"
enabled: true

# Repository configuration
repository:
  url: "${PROJECT_REPO_URL:-https://github.com/example/repo.git}"
  branch: "${PROJECT_BRANCH:-main}"
  clone_path: "${PROJECT_CLONE_PATH:-./repos/example-project}"
  # Optional: Use SSH key for authentication (defaults to null if not set)
  # ssh_key: "${PROJECT_SSH_KEY:-}"
  # Optional: Use HTTPS credentials (defaults to null if not set)
  # username: "${PROJECT_USERNAME:-}"
  # password: "${PROJECT_PASSWORD:-}"

# Programming languages used in this project
languages:
  - "python"
  - "javascript"
  - "typescript"

# Indexing rules - Define which files to include/exclude from analysis
indexing:
  # Include patterns (glob syntax)
  include:
    - "src/**/*.py"
    - "src/**/*.js"
    - "src/**/*.ts"
    - "src/**/*.jsx"
    - "src/**/*.tsx"
  # Exclude patterns (glob syntax)
  exclude:
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "**/venv/**"
    - "**/.venv/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.test.py"
    - "**/*.test.js"
    - "**/*.test.ts"
    - "**/*.spec.js"
    - "**/*.spec.ts"
  # Maximum file size to index (in KB)
  max_file_size: 500

# Ownership mapping - Map code paths to teams or individuals
ownership:
  # Define ownership rules (first match wins)
  rules:
    - path: "src/frontend/**"
      team: "frontend-team"
      owners:
        - "john.doe@example.com"
        - "jane.smith@example.com"
    - path: "src/backend/**"
      team: "backend-team"
      owners:
        - "bob.johnson@example.com"
        - "alice.williams@example.com"
    - path: "src/api/**"
      team: "api-team"
      owners:
        - "charlie.brown@example.com"
    - path: "**"
      team: "general"
      owners:
        - "tech-lead@example.com"

# Project-specific settings
settings:
  # Enable/disable specific analysis features
  enable_static_analysis: true
  enable_security_scanning: true
  enable_code_quality_checks: true
  # Notification preferences
  notify_on_high_severity: true
  notify_on_medium_severity: false
  notification_channels:
    - "slack"
    - "email"
  # Analysis thresholds
  complexity_threshold: 10
  duplication_threshold: 5
